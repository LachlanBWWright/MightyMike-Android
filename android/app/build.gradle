plugins {
    id 'com.android.application'
}

def sdlSourceDir = file('../../extern/SDL3-3.2.2')
if (!file("${sdlSourceDir}/CMakeLists.txt").exists()) {
    throw new GradleException('SDL3 source not found at extern/SDL3-3.2.2. Download it before building Android.')
}

def sdlSourceArg = sdlSourceDir.absolutePath.replace('\\', '/')

def sdlJavaDir = file("${sdlSourceDir}/android-project/app/src/main/java")

android {
    namespace 'io.jor.mightymike'
    compileSdk 34
    ndkVersion '27.3.13750724'

    defaultConfig {
        applicationId 'io.jor.mightymike'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0.0'

        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86_64'
        }

        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_shared', '-DBUILD_SDL_FROM_SOURCE=ON', '-DSDL_STATIC=OFF', "-DSDL3_DIR=${sdlSourceArg}", '-DANDROID=TRUE'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file('../../CMakeLists.txt')
            version '3.22.1'
        }
    }

    sourceSets {
        main {
            assets.srcDirs '../../Data'
            java.srcDirs += [sdlJavaDir]
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
