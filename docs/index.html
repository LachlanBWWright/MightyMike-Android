<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mighty Mike – WebAssembly</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #111;
      color: #eee;
      font-family: system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    header {
      padding: 1rem 2rem;
      text-align: center;
    }

    header h1 { font-size: 2rem; }
    header p  { color: #aaa; margin-top: .25rem; }

    #game-container {
      position: relative;
      width: 640px;
      max-width: 100vw;
    }

    #canvas {
      display: block;
      width: 100%;
      background: #000;
    }

    /* "Click to start" overlay – hides once the user interacts */
    #start-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,.75);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1.5rem;
      gap: 1rem;
    }
    #start-overlay.hidden { display: none; }

    #status {
      padding: .5rem 1rem;
      font-size: .85rem;
      color: #888;
      min-height: 1.5rem;
    }

    /* Developer / Level-editor panel */
    details {
      width: 640px;
      max-width: 100vw;
      margin: .5rem 0 1rem;
      background: #1c1c1c;
      border: 1px solid #333;
      border-radius: 6px;
      padding: .75rem 1rem;
    }
    summary { cursor: pointer; font-weight: bold; }

    .dev-row {
      display: flex;
      align-items: center;
      gap: .5rem;
      margin-top: .75rem;
      flex-wrap: wrap;
    }
    .dev-row label { min-width: 12rem; }

    input[type=number], input[type=text] {
      background: #2a2a2a;
      border: 1px solid #444;
      color: #eee;
      padding: .3rem .5rem;
      border-radius: 4px;
      width: 6rem;
    }
    input[type=text] { width: 20rem; }

    button {
      background: #333;
      color: #eee;
      border: 1px solid #555;
      padding: .35rem .9rem;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover { background: #444; }

    .toggle-row { margin-top: .75rem; display: flex; align-items: center; gap: .75rem; }
  </style>
</head>
<body>
  <header>
    <h1>Mighty Mike</h1>
    <p>WebAssembly build – for testing &amp; level development</p>
  </header>

  <div id="game-container">
    <canvas id="canvas" width="640" height="480" oncontextmenu="event.preventDefault()"></canvas>

    <div id="start-overlay">
      <span>🎮</span>
      <span>Click to start</span>
    </div>
  </div>

  <div style="display:flex; align-items:center; gap:.75rem; padding:.25rem 1rem;">
    <div id="status" style="flex:1;">Loading…</div>
    <button id="fullscreen-btn" title="Toggle fullscreen">⛶ Fullscreen</button>
  </div>

  <!-- ── Developer / Level-editor panel ── -->
  <details id="dev-panel">
    <summary>🛠 Developer / Level-editor tools</summary>

    <div class="dev-row">
      <label for="scene-input">Scene (0–4)</label>
      <input type="number" id="scene-input" min="0" max="4" value="0" />
    </div>
    <div class="dev-row">
      <label for="area-input">Area (0–2)</label>
      <input type="number" id="area-input" min="0" max="2" value="0" />
    </div>
    <div class="dev-row">
      <label for="map-override-input">Map override path</label>
      <input type="text" id="map-override-input"
             placeholder=":Maps:custom.map-1" />
    </div>
    <div class="dev-row">
      <button id="jump-btn">Jump to level</button>
      <small style="color:#888">Reloads the page with ?level=&lt;scene&gt;:&lt;area&gt;</small>
    </div>

    <div class="toggle-row">
      <label>Fence collisions</label>
      <button id="fence-toggle">Enable</button>
      <span id="fence-status" style="color:#aaa">unknown</span>
    </div>
  </details>

  <!-- ── Emscripten runtime ── -->
  <!--
    The CI/CD build produces MightyMike.js + MightyMike.wasm.
    If those files are not present (e.g. viewing this page standalone),
    the placeholder below will keep the page functional without errors.
  -->
  <script>
    // ── Emscripten Module pre-config ──────────────────────────────────────
    var Module = {
      canvas: document.getElementById('canvas'),

      print: function(text) {
        console.log(text);
      },
      printErr: function(text) {
        console.warn(text);
      },
      setStatus: function(text) {
        document.getElementById('status').textContent = text || 'Running ▶';
      },
      totalDependencies: 0,
      monitorRunDependencies: function(left) {
        this.totalDependencies = Math.max(this.totalDependencies, left);
        Module.setStatus(left
          ? 'Preparing… (' + (this.totalDependencies - left) + '/' + this.totalDependencies + ')'
          : 'All downloads complete.');
      }
    };

    // ── Click-to-start overlay (required by browsers for audio) ───────────
    var overlay = document.getElementById('start-overlay');
    overlay.addEventListener('click', function() {
      overlay.classList.add('hidden');
      // If the module hasn't started yet (slow download), load it now.
      if (!window._moduleScriptLoaded) {
        loadGameScript();
      }
    }, { once: true });

    // ── Read URL query params and apply them once the module is ready ─────
    var params = new URLSearchParams(window.location.search);
    var directLevel = params.get('level');      // e.g. "0:1"
    var mapOverride  = params.get('mapOverride'); // e.g. ":Maps:custom.map-1"

    Module['onRuntimeInitialized'] = function() {
      // Apply direct-boot params that were not consumed during C-side init
      // (this path is a safety net; Boot.cpp already reads URLSearchParams).
      if (directLevel) {
        var parts = directLevel.split(':');
        if (parts.length === 2) {
          Module.ccall('Boot_SetDirectLevel', null,
            ['number', 'number'], [parseInt(parts[0]), parseInt(parts[1])]);
        }
      }
      if (mapOverride) {
        Module.ccall('Boot_SetCustomMapPath', null, ['string'], [mapOverride]);
      }

      // Sync fence-collision toggle UI with current game state
      refreshFenceStatus();
    };

    // ── Load the game script ──────────────────────────────────────────────
    function loadGameScript() {
      window._moduleScriptLoaded = true;
      var s = document.createElement('script');
      s.src = 'MightyMike.js';
      s.onerror = function() {
        document.getElementById('status').textContent =
          'MightyMike.js not found – make sure the WASM build artifacts are ' +
          'present in the same directory as this page.';
      };
      document.body.appendChild(s);
    }

    // Start loading immediately (audio context will only open after the click)
    loadGameScript();

    // ── Developer panel logic ─────────────────────────────────────────────
    document.getElementById('jump-btn').addEventListener('click', function() {
      var scene   = document.getElementById('scene-input').value;
      var area    = document.getElementById('area-input').value;
      var mapOvr  = document.getElementById('map-override-input').value.trim();
      var url     = new URL(window.location.href);
      url.searchParams.set('level', scene + ':' + area);
      if (mapOvr) {
        url.searchParams.set('mapOverride', mapOvr);
      } else {
        url.searchParams.delete('mapOverride');
      }
      window.location.href = url.toString();
    });

    function refreshFenceStatus() {
      if (!Module || !Module.ccall) return;
      var enabled = Module.ccall('Cheat_GetFenceCollision', 'number', [], []);
      document.getElementById('fence-status').textContent =
        enabled ? 'enabled (default)' : 'DISABLED';
      document.getElementById('fence-toggle').textContent =
        enabled ? 'Disable' : 'Enable';
    }

    document.getElementById('fence-toggle').addEventListener('click', function() {
      if (!Module || !Module.ccall) return;
      var current = Module.ccall('Cheat_GetFenceCollision', 'number', [], []);
      Module.ccall('Cheat_SetFenceCollision', null, ['number'], [current ? 0 : 1]);
      refreshFenceStatus();
    });

    // Pre-fill the dev panel from current URL params
    if (directLevel) {
      var p = directLevel.split(':');
      if (p.length === 2) {
        document.getElementById('scene-input').value = p[0];
        document.getElementById('area-input').value  = p[1];
      }
    }
    if (mapOverride) {
      document.getElementById('map-override-input').value = mapOverride;
    }

    // ── Fullscreen button ─────────────────────────────────────────────────
    document.getElementById('fullscreen-btn').addEventListener('click', function() {
      var container = document.getElementById('game-container');
      if (!document.fullscreenElement) {
        container.requestFullscreen().catch(function(err) {
          console.warn('Fullscreen error:', err);
        });
      } else {
        document.exitFullscreen();
      }
    });
  </script>
</body>
</html>
